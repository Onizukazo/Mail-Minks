<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Complete 360-degree circular text path -->
    <path id="stampPath" d="M 80, 80 m -57.5, 0 a 57.5,57.5 0 1,1 115,0 a 57.5,57.5 0 1,1 -115,0" fill="none" />
    <filter id="centerDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular End-to-End Bold Text with larger font size -->
  <text fill="#ffffff" font-family="'PP Neue Montreal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="16.5" text-transform="uppercase" letter-spacing="0.5px">
    <textPath href="#stampPath" textLength="361" lengthAdjust="spacing">
      &#8226; 10,000+ CAMPAIGNS SENT &#8226; MAIL MINKS 
    </textPath>
  </text>

  <!-- Center Layer 1: White Disc with soft shadow -->
  <circle cx="80" cy="80" r="23" fill="#ffffff" filter="url(#centerDropShadow)" />
  
  <!-- Center Layer 2: Pale Lime Translucent Halo -->
  <circle cx="80" cy="80" r="19" fill="#d9f99d" opacity="0.75" />
  
  <!-- Center Layer 3: Vibrant Lime Green Dot -->
  <circle cx="80" cy="80" r="13.5" fill="#a3e635" />
</svg>
